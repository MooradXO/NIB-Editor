name: Bug report
description: Report a reproducible problem in NIB.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve NIB. Do not include secrets or private project data.
  - type: input
    id: version
    attributes:
      label: NIB version or commit
      placeholder: v1.0.0-rc.2 or full commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, browser version, GPU, and WebGL2 or WebGPU backend.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Give exact steps and attach a minimal project or repository when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove credentials, personal paths, private assets, and proprietary code.
